<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chat with {{ clinic_name }}</title>
<link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
<style>
  :root {
    --bg: #f7f8fa; --blue: #1d6aff; --t1: #1a1a2e; --t2: #666; --bdr: #e5e7eb;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--t1); font-family: system-ui, -apple-system, sans-serif; }
  .wrap { max-width: 480px; margin: 0 auto; min-height: 100vh; display:flex; flex-direction:column; background:#fff; box-shadow: 0 0 40px rgba(0,0,0,.06); }
  .header { background: var(--blue); color:#fff; padding: 18px 20px; font-weight:600; font-size:16px; }
  .messages { flex:1; overflow-y:auto; padding: 16px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; margin-bottom: 10px; font-size: 14.5px; line-height:1.45; white-space: pre-wrap; }
  .msg.bot { background: #f1f2f5; color: var(--t1); border-bottom-left-radius: 3px; }
  .msg.visitor { background: var(--blue); color: #fff; margin-left: auto; border-bottom-right-radius: 3px; }
  .typing { font-size: 12px; color: #999; padding: 0 16px 8px; display:none; }
  .consent { padding: 14px 16px; background: #fff; border-top: 1px solid var(--bdr); font-size: 12px; color: #555; display:none; }
  .consent button { margin-top: 8px; background: var(--blue); color: #fff; border:none; border-radius: 8px; padding: 9px 16px; font-size: 13px; cursor: pointer; }
  .inputrow { display:none; border-top: 1px solid var(--bdr); padding: 12px; gap: 8px; }
  .inputrow input { flex:1; border:1px solid #ddd; border-radius: 22px; padding: 10px 16px; font-size: 14.5px; outline:none; }
  .inputrow button { background: var(--blue); color:#fff; border:none; border-radius: 50%; width: 40px; height:40px; flex-shrink:0; cursor:pointer; }
  .notfound { padding: 40px 24px; text-align:center; color: var(--t2); }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">Chat with {{ clinic_name }}</div>

  {% if not_found %}
  <div class="notfound">This chat link isn't active right now.</div>
  {% else %}
  <div class="messages" id="messages"></div>
  <div class="typing" id="typing">Typing...</div>
  <div class="consent" id="consent">
    By continuing, you agree to be contacted about your enquiry.
    <div><button id="consent-btn">I agree, continue</button></div>
  </div>
  <div class="inputrow" id="inputrow" style="display:none;">
    <input type="text" id="input" placeholder="Type a message..." />
    <button id="send" aria-label="Send">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="white"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
  {% endif %}
</div>

{% if not not_found %}
<script>
const clinicId = "{{ clinic_id }}";
const state = { conversationId: null, consentGiven: false };

const messagesEl = document.getElementById('messages');
const typingEl   = document.getElementById('typing');
const consentEl  = document.getElementById('consent');
const inputRowEl = document.getElementById('inputrow');
const inputEl    = document.getElementById('input');

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function setTyping(on) { typingEl.style.display = on ? 'block' : 'none'; }

async function startConversation() {
  setTyping(true);
  try {
    const res = await fetch('/api/widget/start', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ clinic_id: clinicId })
    });
    const data = await res.json();
    setTyping(false);
    if (!data.ok) { addMessage('bot', 'Chat is not available right now.'); return; }
    state.conversationId = data.conversation_id;
    addMessage('bot', data.greeting);
    consentEl.style.display = 'block';
  } catch (e) {
    setTyping(false);
    addMessage('bot', 'Something went wrong, please refresh and try again.');
  }
}

document.getElementById('consent-btn').addEventListener('click', async () => {
  const res = await fetch('/api/widget/consent', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ conversation_id: state.conversationId })
  });
  const data = await res.json();
  if (data.ok) {
    state.consentGiven = true;
    consentEl.style.display = 'none';
    inputRowEl.style.display = 'flex';
    inputEl.focus();
  }
});

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || !state.consentGiven) return;
  addMessage('visitor', text);
  inputEl.value = '';
  setTyping(true);
  try {
    const res = await fetch('/api/widget/message', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ conversation_id: state.conversationId, message: text })
    });
    const data = await res.json();
    setTyping(false);
    if (data.human_takeover) return;
    if (data.reply) addMessage('bot', data.reply);
  } catch (e) {
    setTyping(false);
    addMessage('bot', 'Something went wrong, please try again.');
  }
}

document.getElementById('send').addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

startConversation();
</script>
{% endif %}
</body>
</html>
