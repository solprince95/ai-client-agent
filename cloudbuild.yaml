steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "asia-south1-docker.pkg.dev/$PROJECT_ID/vajra-labs/app:$SHORT_SHA"
      - "."
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "asia-south1-docker.pkg.dev/$PROJECT_ID/vajra-labs/app:$SHORT_SHA"
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "vajra-labs"
      - "--image=asia-south1-docker.pkg.dev/$PROJECT_ID/vajra-labs/app:$SHORT_SHA"
      - "--region=asia-south1"
      - "--platform=managed"

images:
  - "asia-south1-docker.pkg.dev/$PROJECT_ID/vajra-labs/app:$SHORT_SHA"

options:
  logging: CLOUD_LOGGING_ONLY
